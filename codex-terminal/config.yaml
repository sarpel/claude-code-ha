---
name: "Codex Terminal Pro"
description: "Enhanced terminal interface for OpenAI's Codex CLI with persistent auth, package management, and image paste support."
version: "1.0.2"
slug: "codex_terminal_pro"
init: false

# Supported architectures (OpenAI ships no arm32 Codex binary)
arch:
  - aarch64
  - amd64

# External resources
url: "https://github.com/sarpel/claude-code-ha"

# Web interface configuration
ingress: true
ingress_port: 7680
panel_icon: mdi:console-line
panel_title: "Codex Terminal Pro"
panel_admin: true

# No host port mappings on purpose.
# The web interface (container port 7680) is reachable through Home Assistant
# ingress only; ttyd (7681) runs unauthenticated behind it, so publishing either
# port on the host would expose a writable root terminal to the local network.
# Ingress also gives each add-on its own panel, so Claude Terminal Pro and
# Codex Terminal Pro can run side by side without any port remapping.

# Add-on configuration options
options:
  auto_launch_codex: true
  dangerously_bypass_approvals: false
  openai_api_key: ""
  persistent_apk_packages: []
  persistent_pip_packages: []
  use_persistent_codex: false
  auto_update_codex_on_start: false

schema:
  auto_launch_codex: bool?
  dangerously_bypass_approvals: bool?
  openai_api_key: password?
  persistent_apk_packages:
    - str?
  persistent_pip_packages:
    - str?
  use_persistent_codex: bool?
  auto_update_codex_on_start: bool?

# Volume mappings for file access
map:
  - config:rw    # Access to Home Assistant configuration files

# API access for Home Assistant integration
hassio_api: true
hassio_role: manager
homeassistant_api: true
auth_api: true

# Service startup configuration
startup: services
